<!DOCTYPE html>
<html class="light" lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>DataManager Pro - CRM</title>

  <!-- Content-Security-Policy: the JWT is kept in localStorage (see LoginView.jsx), so this is
       the actual backstop against token exfiltration if any XSS is ever introduced — connect-src
       'self' blocks a malicious script from POSTing the token anywhere but this app's own origin,
       even though script-src still needs 'unsafe-inline'/'unsafe-eval' for the Tailwind CDN build
       below and the inline tailwind.config script. frame-ancestors isn't honored via <meta> (only
       via the HTTP header — see vite.config.js's server.headers for that), so clickjacking
       protection lives there, not here. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.tailwindcss.com 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self';" />

  <!-- Tailwind CSS with Forms and Container Queries Plugins -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <!-- Google Fonts: Inter (UI), Geist (Mono data), Material Symbols Outlined (Icons) -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist:wght@400;500&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />

  <!-- Custom Tailwind Configuration matching DESIGN.md -->
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "tertiary": "#482700",
            "background": "#f9f9ff",
            "primary-fixed-dim": "#9acee1",
            "surface-dim": "#cfdaf2",
            "primary-container": "#0f4c5c",
            "secondary": "#505f76",
            "on-surface-variant": "#40484b",
            "surface-container": "#e7eeff",
            "tertiary-container": "#623d13",
            "on-tertiary-fixed-variant": "#643e14",
            "on-tertiary": "#ffffff",
            "error-container": "#ffdad6",
            "on-tertiary-container": "#dda975",
            "on-error": "#ffffff",
            "outline": "#70787c",
            "surface-tint": "#306576",
            "primary": "#003441",
            "surface-container-lowest": "#ffffff",
            "error": "#ba1a1a",
            "on-secondary": "#ffffff",
            "on-primary": "#ffffff",
            "tertiary-fixed-dim": "#f3bc87",
            "on-secondary-fixed": "#0b1c30",
            "on-secondary-container": "#54647a",
            "surface-variant": "#d8e3fb",
            "surface-container-highest": "#d8e3fb",
            "secondary-fixed-dim": "#b7c8e1",
            "on-background": "#111c2d",
            "surface-bright": "#f9f9ff",
            "on-primary-container": "#87bbce",
            "outline-variant": "#c0c8cb",
            "surface-container-low": "#f0f3ff",
            "on-primary-fixed-variant": "#114d5d",
            "on-tertiary-fixed": "#2c1600",
            "inverse-primary": "#9acee1",
            "surface-container-high": "#dee8ff",
            "inverse-on-surface": "#ecf1ff",
            "primary-fixed": "#b6ebfe",
            "secondary-container": "#d0e1fb",
            "on-surface": "#111c2d",
            "inverse-surface": "#263143",
            "secondary-fixed": "#d3e4fe",
            "on-error-container": "#93000a",
            "surface": "#f9f9ff",
            "tertiary-fixed": "#ffdcbe"
          },
          "borderRadius": {
            "DEFAULT": "0.125rem",
            "lg": "0.25rem",
            "xl": "0.5rem",
            "full": "0.75rem"
          },
          "spacing": {
            "table-cell-padding-x": "0.75rem",
            "gutter": "1rem",
            "table-cell-padding-y": "0.5rem",
            "sidebar-width": "240px",
            "topbar-height": "56px",
            "container-padding": "1.5rem"
          },
          "fontFamily": {
            "body-sm": ["Inter"],
            "headline-md": ["Inter"],
            "body-md": ["Inter"],
            "data-mono": ["Geist"],
            "label-caps": ["Inter"],
            "headline-lg": ["Inter"]
          },
          "fontSize": {
            "body-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
            "headline-md": ["18px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
            "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
            "data-mono": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
            "label-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
            "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "600" }]
          }
        },
      },
    }
  </script>
  <style>
    body {
      background-color: #F8FAFC;
      color: #111C2D;
      font-family: 'Inter', sans-serif;
    }

    /* Smooth transitions & custom micro-animations */
    .transition-all-300 {
      transition: all 300ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    .hover-card-lift {
      transition: all 300ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    .hover-card-lift:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 20px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    .hover-scale {
      transition: all 200ms ease;
    }

    .hover-scale:hover {
      transform: scale(1.02);
    }

    /* Page fade-in/slide-in keyframes */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in {
      animation: fadeIn 350ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideInLeft {
      from {
        transform: translateX(-15px);
        opacity: 0;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .animate-slide-in-left {
      animation: slideInLeft 400ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Modern premium scrollbar styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #E2E8F0;
      border-radius: 9999px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #CBD5E1;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
