# nginx server block for the Lead Management CRM.
# Serves the built React frontend as static files and reverse-proxies /api to
# the Node backend (systemd service on 127.0.0.1:5000).
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/skilllabs-crm
#   sudo ln -s /etc/nginx/sites-available/skilllabs-crm /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace crm.yourdomain.com below with your real domain, then run certbot
# (certbot --nginx -d crm.yourdomain.com) to add HTTPS — do this before
# sending real login/session traffic over the public internet.

server {
    listen 80;
    server_name crm.yourdomain.com;

    root /opt/skilllabs-crm/frontend/dist;
    index index.html;

    # React Router / client-side routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend service
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m; # matches the 10MB upload limit in index.js, plus headroom
    }
}
